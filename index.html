<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cipherline — Built to keep data uncompromised</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0d0c;
    --ink-2:#15181a;
    --ink-3:#1f2326;
    --line:#e6e2da;
    --paper:#f5f2eb;
    --paper-2:#efeae0;
    --paper-3:#e8e2d5;
    --text:#0b0d0c;
    --muted:#5b6065;
    --muted-2:#8a8f95;
    --cyan:#22e0c8;
    --cyan-2:#9cf7e9;
    --cyan-deep:#0d8c7c;
    --danger:#ff6b4a;
    --warn:#f3b13a;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--text);font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:0;background:transparent}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:-0.01em}
  ::selection{background:var(--cyan);color:var(--ink)}
  #root{min-height:100vh}
  /* scrollbar polish */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfc8b8;border-radius:10px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* =========================================================
   ICONS — minimal stroke set
   ========================================================= */
const Icon = {
  arrow: (p)=> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 12h14M13 6l6 6-6 6"/></svg>,
  check: (p)=> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20 6L9 17l-5-5"/></svg>,
  caret: (p)=> <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M6 9l6 6 6-6"/></svg>,
  shield: (p)=> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/></svg>,
  lock: (p)=> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>,
  key: (p)=> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l3 3"/></svg>,
  pulse: (p)=> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>,
  globe: (p)=> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>,
  shieldFill: (p)=> <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/></svg>,
  cube: (p)=> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>,
  scan: (p)=> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg>,
  badge: (p)=> <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>,
  bolt: (p)=> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"><path d="M13 2L4 14h7l-2 8 9-12h-7l2-8z"/></svg>,
  alert: (p)=> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.86L1.82 18a2 2 0 0 0 1.7 3h16.96a2 2 0 0 0 1.7-3L13.7 3.86a2 2 0 0 0-3.4 0z"/></svg>,
  dot: (p)=> <svg width="8" height="8" viewBox="0 0 8 8" {...p}><circle cx="4" cy="4" r="4"/></svg>,
};

/* =========================================================
   LOGO — Cipherline (custom mark: layered hex/diamond)
   ========================================================= */
const Logo = ({mono=false, size=22})=>{
  const c = mono ? 'currentColor' : '#0b0d0c';
  const a = mono ? 'currentColor' : '#22e0c8';
  return (
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <svg width={size} height={size} viewBox="0 0 32 32" fill="none">
        <path d="M16 2L29 9v14L16 30 3 23V9L16 2z" stroke={c} strokeWidth="2" strokeLinejoin="round"/>
        <path d="M16 8L24 12.5v7L16 24 8 19.5v-7L16 8z" fill={a} stroke={c} strokeWidth="1.5" strokeLinejoin="round"/>
        <path d="M13 14l3 2 3-2M13 18l3 2 3-2" stroke={c} strokeWidth="1.5" strokeLinecap="round"/>
      </svg>
      <span style={{fontWeight:700,fontSize:size*0.78,letterSpacing:'-0.02em'}}>Cipherline</span>
    </div>
  );
};

/* =========================================================
   ANNOUNCEMENT BAR
   ========================================================= */
const AnnouncementBar = ()=> (
  <div style={{
    background:'var(--cyan-2)',
    borderBottom:'1px solid #b9e8de',
    color:'var(--ink)',
    fontSize:13,
    letterSpacing:'-0.005em',
    padding:'9px 16px',
    textAlign:'center',
  }}>
    <span className="mono" style={{
      background:'var(--ink)', color:'var(--cyan)', padding:'2px 7px', borderRadius:4,
      fontSize:10, fontWeight:600, letterSpacing:'0.08em', marginRight:10
    }}>NEW</span>
    Cipherline v4 ships post‑quantum key wrapping in beta.{' '}
    <a style={{borderBottom:'1px solid currentColor', paddingBottom:1}}>Read the changelog →</a>
  </div>
);

/* =========================================================
   NAV
   ========================================================= */
const NAV = [
  { label:'Platform', items:[
    {t:'Tokenization Vault', d:'Replace sensitive data with format‑preserving tokens'},
    {t:'Key Management', d:'Hardware‑backed KMS with bring‑your‑own‑key'},
    {t:'Threat Intelligence', d:'Real‑time anomaly + leak detection'},
    {t:'Access Control', d:'Policy‑as‑code, just‑in‑time grants'},
  ]},
  { label:'Use Cases', items:[
    {t:'Financial Services', d:'PCI scope reduction & cardholder data'},
    {t:'Healthcare', d:'PHI protection, HIPAA workloads'},
    {t:'SaaS & AI', d:'Protect customer data in model pipelines'},
    {t:'Government', d:'FedRAMP‑ready isolation'},
  ]},
  { label:'Developers', items:[
    {t:'Documentation', d:'SDKs, API reference, tutorials'},
    {t:'Quickstarts', d:'Tokenize your first record in 4 minutes'},
    {t:'Status', d:'99.999% uptime across 14 regions'},
    {t:'Open Source', d:'Cipher CLI, ciphered.js, helm charts'},
  ]},
  { label:'Pricing' },
  { label:'Company' },
];

const Nav = ()=>{
  const [open,setOpen] = useState(null);
  return (
    <nav style={{
      maxWidth:1240,margin:'0 auto',padding:'18px 24px',
      display:'flex',alignItems:'center',justifyContent:'space-between',
      position:'relative'
    }}
    onMouseLeave={()=>setOpen(null)}>
      <Logo />
      <div style={{display:'flex',alignItems:'center',gap:4}}>
        {NAV.map((n,i)=>(
          <div key={i} style={{position:'relative'}}
               onMouseEnter={()=>setOpen(n.items?i:null)}>
            <button style={{
              display:'flex',alignItems:'center',gap:4,
              padding:'8px 12px',borderRadius:6,fontSize:14,fontWeight:500,
              color:open===i?'var(--ink)':'#2a2e32',
              background:open===i?'rgba(11,13,12,0.04)':'transparent'
            }}>
              {n.label}
              {n.items && <Icon.caret style={{opacity:0.5,marginTop:1}}/>}
            </button>
            {n.items && open===i && (
              <div style={{
                position:'absolute',top:'100%',left:0,marginTop:6,zIndex:50,
                background:'#fff',border:'1px solid var(--line)',borderRadius:12,
                padding:8,width:340,
                boxShadow:'0 30px 60px -20px rgba(11,13,12,0.18), 0 8px 20px -10px rgba(11,13,12,0.1)'
              }}>
                {n.items.map((it,j)=>(
                  <a key={j} style={{
                    display:'block',padding:'10px 12px',borderRadius:8,
                    transition:'background 120ms'
                  }}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--paper-2)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    <div style={{fontWeight:600,fontSize:14}}>{it.t}</div>
                    <div style={{fontSize:12.5,color:'var(--muted)',marginTop:2}}>{it.d}</div>
                  </a>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <button style={{padding:'8px 12px',fontSize:14,fontWeight:500}}>Sign in</button>
        <button style={{
          padding:'9px 16px',fontSize:14,fontWeight:600,
          background:'var(--ink)',color:'#fff',borderRadius:999,
        }}>Get a demo</button>
      </div>
    </nav>
  );
};

/* =========================================================
   HERO ISOMETRIC — Cipher Vault
   ========================================================= */
const HeroArt = ()=> {
  return (
    <div style={{position:'relative',width:'100%',height:480}}>
      {/* connecting lines */}
      <svg viewBox="0 0 600 480" style={{position:'absolute',inset:0,width:'100%',height:'100%'}}>
        <defs>
          <linearGradient id="ll" x1="0" x2="1">
            <stop offset="0" stopColor="#22e0c8" stopOpacity="0"/>
            <stop offset="0.4" stopColor="#22e0c8" stopOpacity="0.8"/>
            <stop offset="1" stopColor="#22e0c8" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {/* horizon/grid hints */}
        <g stroke="#d9d3c4" strokeWidth="1" fill="none">
          <path d="M50 120 L300 60 L550 120"/>
          <path d="M30 200 L300 130 L570 200"/>
          <path d="M20 290 L300 215 L580 290"/>
          <path d="M30 380 L300 305 L570 380"/>
        </g>
        {/* moving pulses */}
        <path d="M30 60 Q 300 0 570 60" stroke="url(#ll)" strokeWidth="1.4" fill="none">
          <animate attributeName="stroke-dashoffset" from="200" to="0" dur="3s" repeatCount="indefinite"/>
        </path>
      </svg>

      {/* back card */}
      <div style={{
        position:'absolute',right:30,top:60,width:360,height:260,
        background:'#fff',border:'1px solid var(--line)',borderRadius:14,
        transform:'rotate(-3deg)',
        boxShadow:'0 20px 40px -20px rgba(11,13,12,0.15)'
      }}>
        <div style={{padding:14,borderBottom:'1px solid var(--line)',display:'flex',gap:6,alignItems:'center'}}>
          <span className="mono" style={{fontSize:10,color:'var(--muted-2)',letterSpacing:'0.08em'}}>NODE • US‑EAST‑1</span>
          <span style={{flex:1}}/>
          <Icon.dot style={{color:'#3ad07e'}}/>
          <span className="mono" style={{fontSize:10,color:'var(--muted)'}}>HEALTHY</span>
        </div>
        <div style={{padding:'18px 18px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[
            ['tok_4a91…','✓'],['tok_2e07…','✓'],['tok_99fb…','✓'],
            ['tok_b14c…','✓'],['tok_77d3…','✓'],['tok_c0a2…','✓'],
          ].map(([t,v],i)=>(
            <div key={i} className="mono" style={{
              fontSize:11,padding:'8px 10px',background:'var(--paper-2)',
              borderRadius:6,display:'flex',justifyContent:'space-between',color:'#3a3e42'
            }}>
              <span>{t}</span><span style={{color:'var(--cyan-deep)'}}>{v}</span>
            </div>
          ))}
        </div>
      </div>

      {/* main vault block — isometric */}
      <svg viewBox="0 0 600 480" style={{position:'absolute',inset:0,width:'100%',height:'100%'}}>
        <defs>
          <linearGradient id="vTop" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stopColor="#1d2024"/>
            <stop offset="1" stopColor="#0b0d0c"/>
          </linearGradient>
          <linearGradient id="vSide" x1="0" x2="1">
            <stop offset="0" stopColor="#080a0a"/>
            <stop offset="1" stopColor="#161a1d"/>
          </linearGradient>
        </defs>
        {/* shadow */}
        <ellipse cx="300" cy="380" rx="180" ry="20" fill="#000" opacity="0.08"/>
        {/* base shell */}
        <g transform="translate(200,180)">
          {/* sides */}
          <path d="M0 60 L100 120 L100 160 L0 100 Z" fill="url(#vSide)"/>
          <path d="M100 120 L200 60 L200 100 L100 160 Z" fill="#0b0d0c"/>
          {/* top */}
          <path d="M0 60 L100 0 L200 60 L100 120 Z" fill="url(#vTop)" stroke="#2a2e32" strokeWidth="1"/>
          {/* inset square */}
          <path d="M50 60 L100 30 L150 60 L100 90 Z" fill="#0b0d0c" stroke="#2a2e32"/>
          {/* glowing diamond */}
          <path d="M70 60 L100 45 L130 60 L100 75 Z" fill="#22e0c8"/>
          <path d="M85 60 L100 52.5 L115 60 L100 67.5 Z" fill="#0b0d0c"/>
          {/* corner studs */}
          {[[0,60],[100,0],[200,60],[100,120]].map((p,i)=>(
            <circle key={i} cx={p[0]} cy={p[1]} r="2.5" fill="#22e0c8" opacity="0.9"/>
          ))}
        </g>
        {/* radiating cyan pulse */}
        <g transform="translate(300,225)">
          <circle r="60" fill="none" stroke="#22e0c8" strokeWidth="1" opacity="0.5">
            <animate attributeName="r" from="50" to="120" dur="2.4s" repeatCount="indefinite"/>
            <animate attributeName="opacity" from="0.4" to="0" dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <circle r="60" fill="none" stroke="#22e0c8" strokeWidth="1" opacity="0.5">
            <animate attributeName="r" from="50" to="120" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" from="0.4" to="0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
          </circle>
        </g>
      </svg>

      {/* status chip */}
      <div style={{
        position:'absolute',left:30,bottom:80,
        background:'#fff',border:'1px solid var(--line)',borderRadius:10,padding:'10px 14px',
        boxShadow:'0 14px 30px -16px rgba(11,13,12,0.18)',
        display:'flex',alignItems:'center',gap:10,
      }}>
        <Icon.shieldFill style={{color:'var(--cyan-deep)'}}/>
        <div>
          <div style={{fontSize:12,fontWeight:600}}>AES‑256 · FIPS 140‑3</div>
          <div className="mono" style={{fontSize:10.5,color:'var(--muted)',marginTop:1}}>encrypted at rest · in transit · in use</div>
        </div>
      </div>
    </div>
  );
};

/* =========================================================
   HERO
   ========================================================= */

  return (
    <section style={{maxWidth:1240,margin:'0 auto',padding:'40px 24px 80px',
      display:'grid',gridTemplateColumns:'1.05fr 1fr',gap:48,alignItems:'center'
    }}>
      <div>
        <div className="mono" style={{
          display:'inline-flex',alignItems:'center',gap:8,

/* =========================================================
   TRUST BAR
   ========================================================= */
const TrustBar = ()=>{
  const logos = ['NORTHWIND','HELIOS BANK','◇ Meridian','ATLAS · health','Vertex Labs','PARALLAX'];
  return (
    <section style={{background:'var(--ink)',color:'#cdd2d6'}}>

/* =========================================================
   SECTION INTRO ("Never miss a payment" equivalent)
   ========================================================= */
const TABS = [
  { key:'fin',     label:'Financial' },
  { key:'health',  label:'Healthcare' },
  { key:'saas',    label:'SaaS' },
  { key:'gov',     label:'Government' },
];

const SectionIntro = ({active,setActive})=>(
  <section style={{maxWidth:1240,margin:'0 auto',padding:'80px 24px 24px'}}>
    <div style={{display:'grid',gridTemplateColumns:'1.1fr 1.6fr',gap:60,alignItems:'end'}}>
      <h2 style={{fontSize:54,lineHeight:1,letterSpacing:'-0.03em',fontWeight:600,margin:0}}>
        Never leak<br/>a record.
      </h2>
      <p style={{fontSize:17,lineHeight:1.55,color:'#3a3e42',maxWidth:620,margin:0}}>
        An agnostic data vault that slots into any application stack without disrupting business. Whether a user is signing up, a partner is exchanging records, or an AI agent is reading from your warehouse — Cipherline keeps the data secure and usable, while staying compliant with PCI DSS 4.0, SOC 2 Type II, ISO 27001, and HIPAA.
      </p>
    </div>
    <div style={{
      marginTop:36,paddingBottom:0,borderBottom:'1px solid var(--line)',
      display:'flex',gap:4,
    }}>
      {TABS.map(t=>(
        <button key={t.key}
          onClick={()=>setActive(t.key)}
          style={{
            padding:'12px 18px',fontSize:14,fontWeight:500,
            borderBottom:active===t.key?'2px solid var(--ink)':'2px solid transparent',
            marginBottom:-1,
            color:active===t.key?'var(--ink)':'var(--muted)'
          }}>
          <span style={{
